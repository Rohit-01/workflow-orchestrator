id: ai-health-check
namespace: devops.monitor

description: |
  **Use case:** Simple application health check with conditional alerting.
  This flow will:
  - Make an HTTP GET request to the specified `server_uri` (your app's health endpoint).
  - Check the HTTP response code.
  - If the response code is not 200, it will send a Slack alert and log an "unhealthy" message.
  - If the response code is 200, it will log a "healthy" message.
  - It's scheduled to run daily at 9:00 AM UTC, but you can adjust the `cron` expression or disable it.
  - Slack notifications use the `slack_webhook_uri` input (placeholder by default — set your real Incoming Webhook URL in Kestra or per run).

labels:
  name: Application Health check
  
inputs:
  - id: server_uri
    type: URI
    defaults: "YOUR_APP_HEALTH_ENDPOINT_HERE" # e.g. http://EC2_PUBLIC_IP:5000/health
    description: "Full URL to check (e.g. http://EC2_PUBLIC_IP:5000/health). Set via trigger or execution inputs."

  - id: slack_webhook_uri
    type: URI
    defaults: "put-your-own-slack-webhook-url-here"
    description: "Slack Incoming Webhook URL. Replace the default placeholder with your real webhook (or override when executing)."

tasks:
  - id: http_request
    type: io.kestra.plugin.core.http.Request
    description: Check the target server endpoint for an HTTP response.
    uri: "{{ inputs.server_uri }}"
    method: GET
    options:
      allowFailed: true # Allows the flow to continue even if the HTTP request returns a non-2xx status

  - id: check_status
    type: io.kestra.plugin.core.flow.If
    description: Branch based on the HTTP status to alert or confirm health.
    condition: "{{ outputs.http_request.code != 200 }}" # Checks if the HTTP status code is not 200
    then:
      - id: ai_diagnosis_on_failure
        type: io.kestra.plugin.ai.agent.AIAgent
        allowFailure: true
        systemMessage: "You are an SRE. The Flask application health check has just failed on AWS EC2. Respond in a single line with no line breaks, using this format: Cause: <likely cause> | Fix: <immediate remediation step>"
        prompt: |
          The Flask app at {{ inputs.server_uri }} failed its health check. Diagnose the most likely cause and immediate remediation step.
      - id: server_unreachable_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send a Slack alert if the server cannot be reached.
        url: "{{ inputs.slack_webhook_uri }}"
        payload: |
          {
            "channel": "#alerts",
            "text": "The server {{ inputs.server_uri }} is down❌. Response Code: {{ outputs.http_request.code }}. Possible Cause: {{ outputs.ai_diagnosis_on_failure.textOutput }}"
          }
      - id: log_failure_explanation
        type: io.kestra.plugin.core.log.Log
        message: "The server {{ inputs.server_uri }} is down. Response Code: {{ outputs.http_request.code }}. Possible Cause: {{ outputs.ai_diagnosis_on_failure.textOutput }}"
    else:
      - id: healthy
        type: io.kestra.plugin.core.log.Log
        description: Log that the server is responding normally.
        message: "Everything is fine for {{ inputs.server_uri }}! Response Code: {{ outputs.http_request.code }}"

      - id: server_healthy_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send a Slack alert with Healthy Status.
        url: "{{ inputs.slack_webhook_uri }}"
        payload: |
          {
            "channel": "#alerts",
            "text": "The server {{ inputs.server_uri }} is Up ✅ ! Response Code: {{ outputs.http_request.code }}."
          }

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    # disabled: true # Uncomment to disable scheduled runs initially
    cron: "0 9 * * *" # Example: Run daily at 9 AM UTC
    inputs:
      server_uri: "put-your-own-server-uri-here"  # paste IP from terraform output aws_ec2_public_ip

# ─── Provider config (applied to all AIAgent tasks in this flow) ─────────────
#
#  The provider MUST support function/tool calling.
#  Supported: OpenAI GPT-4o/GPT-4o-mini, Google Gemini 1.5+, Anthropic Claude 3+
#
#  Set ONE of the secrets below in Kestra and uncomment the matching block.
# ─────────────────────────────────────────────────────────────────────────────
pluginDefaults:
  - type: io.kestra.plugin.ai.agent.AIAgent
    values:
      provider:
        type: io.kestra.plugin.ai.provider.GoogleGemini
        modelName: gemini-2.5-flash
        apiKey: "PUT-YOUR-OWN"
        configuration:
          logRequests: true
          logResponses: true
          responseFormat:
            type: TEXT

      # ── Google Gemini alternative ──────────────────────────────────────────
      # provider:
      #   type: io.kestra.plugin.ai.provider.GoogleGemini
      #   apiKey: "{{ secret('GEMINI_API_KEY') }}"
      #   modelName: gemini-2.5-flash

      # ── Anthropic Claude alternative ───────────────────────────────────────
      # provider:
      #   type: io.kestra.plugin.ai.provider.Anthropic
      #   apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
      #   modelName: claude-opus-4-6